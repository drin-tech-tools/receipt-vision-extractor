services:
  - type: web
    name: receipt-vision-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard; never commit it
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
